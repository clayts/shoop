<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Shoop — Game full</title>
		<link rel="stylesheet" href="/style.css">
		<style>
			html, body {
				overflow: auto;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: 'Courier Prime', Courier, 'Courier New', monospace;
				color: var(--ui-text-color);
				text-align: center;
				padding: 2rem;
			}

			.full-message h1 {
				color: white;
				font-size: 2rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				margin-bottom: 1rem;
			}

			.full-message p {
				margin-bottom: 1.5rem;
			}

			.full-message a {
				color: white;
			}
		</style>
	</head>
	<body>
		<div class="full-message">
			<h1>Game full</h1>
			<p>This game already has two players.</p>
			<a href="/">Back home</a>
		</div>
	</body>
</html>
