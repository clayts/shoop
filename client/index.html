<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoop</title>
    <!-- Retro Typewriter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #808e6c;
            --text-color: #ffffff;
            --muted-color: rgba(255, 255, 255, 0.75);
            --border-color: rgba(255, 255, 255, 0.2);
            --hover-bg: rgba(255, 255, 255, 0.2);
            --font-stack: 'Courier Prime', Courier, 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 110px; /* Fixed uniform height */
            gap: 0.5rem;
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .menu-item:hover {
            background-color: var(--hover-bg);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: 0.9rem;
            color: var(--muted-color);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>Shoop</h1>
        </header>

        <nav class="menu">
            <!-- Local Game Option -->
            <a href="./game/local" class="menu-item">
                <span class="title">Local Game</span>
                <span class="description">Play a game with a friend locally by taking turns sharing the same screen.</span>
            </a>

            <!-- Private Game Option -->
            <a href="./game/private" class="menu-item">
                <span class="title">Private Game</span>
                <span class="description">Play a game with a friend remotely by sending an invite link.</span>
            </a>

            <!-- Public Game Option -->
            <a href="./game/public" class="menu-item">
                <span class="title">Public Game</span>
                <span class="description">Play a game with a random stranger online.</span>
            </a>
        </nav>
    </main>

</body>
</html>
